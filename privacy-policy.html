function detectLang() {
  const raw = (navigator.language || 'en');
  const map = { 'zh-TW': 'zh-CN', 'zh-Hans': 'zh-CN' };
  const mapped = map[raw] || raw;
  if (I18N[mapped]) return mapped;
  const base = mapped.split('-')[0].toLowerCase();
  return I18N[base] ? base : 'en';
}

function apply(t) {
  document.title = t.title.replace(/🔒\s*/, '') + ' - RefreshMate';
  document.getElementById('title').textContent = t.title;
  document.getElementById('updated').textContent = t.updated;
  document.getElementById('highlight').innerHTML = t.highlight;
  ['h1','p1','h2','p2','p2note','h3','p3','h4','p4','h5','p5','h6','p6','rights'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (id === 'l1') el.innerHTML = t.l1.map(i => '<li>'+i+'</li>').join('');
    else if (id === 'l2') el.innerHTML = t.l2.map(i => '<li>'+i+'</li>').join('');
    else el[id.startsWith('p')||id.startsWith('h') ? 'innerHTML' : 'textContent'] = t[id];
  });
  if (t.l1) document.getElementById('l1').innerHTML = t.l1.map(i => '<li>'+i+'</li>').join('');
  if (t.l2) document.getElementById('l2').innerHTML = t.l2.map(i => '<li>'+i+'</li>').join('');
  // Render l4 (third-party services details) if present
  const l4El = document.getElementById('l4');
  if (l4El && t.l4) l4El.innerHTML = t.l4.map(i => '<li>'+i+'</li>').join('');
  document.documentElement.lang = detectLang();
}

apply(I18N[detectLang()]);
